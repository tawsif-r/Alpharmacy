apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: tawsifr/alpharmacy-backend  # You will build and push this
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        volumeMounts:
        - name: app-volume
          mountPath: /app
      volumes:
      - name: app-volume
        hostPath:
          path: /Users/tawsifurrahman/Documents/alpharmacy/alpharmacy  # Or use ConfigMap/PersistentVolume in real deployments
