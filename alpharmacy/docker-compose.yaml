services:
  backend:
    container_name: alpharmacy
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 8003:8000
    volumes:
      - .:/app
    depends_on:
      - db
  db:
    container_name: pharmacy_db
    image: postgres:latest
    env_file:
      - .env
    ports:
      - "5436:5432"
    volumes:
    - ./postgres_data:/var/lib/postgresql/data